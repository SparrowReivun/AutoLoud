name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on v* tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python tools/make_icon.py
      - run: pyinstaller --noconfirm --clean AutoLoud.spec
      - name: Smoke-test the exe (simulator backend, offscreen)
        shell: pwsh
        run: |
          $env:AUTOLOUD_MOCK = "1"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:AUTOLOUD_EXIT_AFTER = "6"
          $p = Start-Process -FilePath dist\AutoLoud.exe -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "exe exited with $($p.ExitCode)"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: AutoLoud-windows
          path: dist/AutoLoud.exe
      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoLoud.exe
